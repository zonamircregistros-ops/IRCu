########################################################################
#                                                                      #
#              Configuracion de ejemplo para InspIRCd v4.11.0         #
#                                                                      #
#  Este archivo esta basado en el inspircd.example.conf oficial de    #
#  InspIRCd 4 (rama insp4), con una seleccion de opciones y modulos    #
#  ya pensada para una red publica con servicios (Anope/Atheme),      #
#  TLS y proteccion anti-flood/anti-abuso activada.                   #
#                                                                      #
#  LOS UNICOS ARCHIVOS QUE DEBERIAS NECESITAR TOCAR SON:               #
#    - Este archivo: solo los bloques <define>, <server> y <admin>,    #
#      y las rutas de los certificados TLS en modules.conf.            #
#    - opers.conf   -> tus IRCops.                                     #
#    - links.conf   -> tus enlaces de servidor / servicios.            #
#                                                                      #
#  Documentacion oficial: https://docs.inspircd.org/4/configuration/  #
########################################################################

#-#-#-#-#-#-#-#-#-#-#-#  VARIABLE DEFINITIONS  -#-#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# EDITAR: cambia el nombre y dominio de tu red aqui. Estas variables  #
# se reutilizan en el resto de este archivo, en modules.conf,         #
# opers.conf y links.conf mediante &networkName; &networkDomain; y    #
# &servicesServer;                                                    #
#                                                                     #

<define name="networkName" value="EjemploNet">
<define name="networkDomain" value="ejemplo.net">

# Nombre del servidor de servicios (Anope/Atheme). Debe coincidir con
# el <server:name> que configures en el paquete de servicios y con el
# <link> que definas para el en links.conf.
<define name="servicesServer" value="services.&networkDomain;">

#-#-#-#-#-#-#-#-#-#-#-#-  SERVER DESCRIPTION  -#-#-#-#-#-#-#-#-#-#-#-#-
#                                                                     #
# EDITAR: nombre y descripcion de ESTE servidor concreto (si tienes   #
# varios servidores, cada uno necesita su propio nombre unico).       #
#                                                                     #

<server
        name="irc.&networkDomain;"
        description="&networkName; IRC server"

        # id: SID de 3 caracteres (1 digito + 2 alfanumericos). Solo hace
        # falta si hay colision de SID; si no, dejalo comentado y se
        # generara automaticamente.
        #id="1AB"

        network="&networkName;">


#-#-#-#-#-#-#-#-#-#-#-#-   ADMIN INFORMATION   -#-#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# EDITAR: datos de contacto del administrador de este servidor.       #
#                                                                     #

<admin
       name="Admin"
       description="Network Administrator"
       email="irc@&networkDomain;">


#-#-#-#-#-#-#-#-#-#-#-#-   PORT CONFIGURATION   -#-#-#-#-#-#-#-#-#-#-#-
#                                                                     #
# Puertos para clientes. El perfil TLS "Clients" se define en         #
# modules.conf, junto al modulo ssl_openssl -- ahi debes poner la     #
# ruta a tus certificados.                                            #
#                                                                     #

# Puerto TLS (recomendado como puerto principal para los usuarios).
<bind address="" port="6697" type="clients" sslprofile="Clients">

# Puerto en texto plano (compatibilidad). Si no quieres ofrecer texto
# plano, simplemente borra o comenta esta linea.
<bind address="" port="6667" type="clients">

# WebSocket (chat web). Descomenta si vas a usar un cliente web y
# activa el modulo websocket en modules.conf.
#<bind address="" port="7002" type="clients" hook="websocket">


#-#-#-#-#-#-#-#-#-#-  CONNECTIONS CONFIGURATION  -#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# Los bloques <connect> se leen de arriba a abajo: pon primero los    #
# mas especificos (deny) y al final el generico allow="*".            #
#                                                                     #

# Bloquea el espacio de direcciones 6bone, obsoleto y usado casi       #
# siempre por bots/abuso.
<connect deny="3ffe::0/32" reason="The 6bone address space is deprecated">

# Clase de conexion general para todos los usuarios.
<connect
         name="main"
         allow="*"
         maxchans="30"
         timeout="20"
         pingfreq="2m"
         hardsendq="1M"
         softsendq="10240"
         recvq="10K"
         threshold="10"
         commandrate="1000"
         fakelag="yes"
         localmax="3"
         globalmax="3"
         resolvehostnames="yes"
         useident="no"
         limit="5000"

         # modes: +x cloakea el host al conectar (requiere cloak +
         # cloak_sha256), +c requiere canal comun para recibir PM
         # (requiere commonchans). Ambos modulos estan activados en
         # modules.conf.
         modes="+cx">

# Ejemplo de clase mas restrictiva para, por ejemplo, un rango
# problematico o una franja horaria de pruebas. Descomenta y ajusta
# si la necesitas; recuerda que debe ir ANTES de "main".
#<connect
#         name="restricted"
#         parent="main"
#         allow="203.0.113.*"
#         localmax="1"
#         globalmax="1"
#         limit="50">


#-#-#-#-#-#-#-#-#-#-#-#-  CIDR CONFIGURATION   -#-#-#-#-#-#-#-#-#-#-#-
<cidr ipv4clone="32" ipv6clone="128">

# Tus IRCops y clases/tipos de oper (EDITAR este archivo aparte).
<include file="opers.conf">


#-#-#-#-#-#-#-#-#-#-  MISCELLANEOUS CONFIGURATION  -#-#-#-#-#-#-#-#-#-#
<files motd="motd.txt">

#-#-#-#-#-#-#-#-#-#-#-#-#-#-# DNS SERVER -#-#-#-#-#-#-#-#-#-#-#-#-#-#-#
<dns timeout="10s">

#-#-#-#-#-#-#-#-#-#-#-#-#- LIST MODE LIMITS #-#-#-#-#-#-#-#-#-#-#-#-#-#
<maxlist chan="*" limit="100">

#-#-#-#-#-#-#-#-#-#-#-#-#-  SERVER OPTIONS   -#-#-#-#-#-#-#-#-#-#-#-#-#
<options
         prefixquit="Quit: "
         suffixquit=""
         prefixpart="&quot;"
         suffixpart="&quot;"
         syntaxhints="no"
         cyclehostsfromuser="no"
         announcets="yes"
         allowmismatch="no"
         defaultbind="auto"
         maskinlist="yes"
         maskintopic="yes"
         pingwarning="15"
         serverpingfreq="1m"
         splitwhois="no"

         # defaultmodes: n=sin mensajes externos, t=topic solo ops.
         defaultmodes="nt"

         xlinemessage="Estas baneado de la red. Escribe a irc@&networkDomain; con el error de mas abajo si crees que es un error."
         xlinequit="%fulltype%: %reason%"
         modesinlist="opers"
         extbanformat="name"
         exemptchanops="filter:o nickflood:o nonick:v regmoderated:o"
         invitebypassmodes="yes"
         nosnoticestack="no">

#-#-#-#-#-#-#-#-#-#-#-# PERFORMANCE CONFIGURATION #-#-#-#-#-#-#-#-#-#-#
<performance
             netbuffersize="10240"
             somaxconn="128"
             softlimit="12800"
             clonesonconnect="yes"
             timeskipwarn="2s"
             quietbursts="yes">

#-#-#-#-#-#-#-#-#-#-#-# SECURITY CONFIGURATION  #-#-#-#-#-#-#-#-#-#-#-#
<security
          announceinvites="dynamic"
          hideservices="no"
          flatlinks="no"
          hidekills=""
          hideservicekills="yes"
          hidesplits="no"
          maxtargets="20"
          customversion=""

          # runasuser/runasgroup: solo si arrancas el proceso como
          # root para poder abrir puertos <1024 y luego bajar
          # privilegios. Normalmente déjalo comentado.
          #runasuser=""
          #runasgroup=""

          restrictbannedusers="yes"
          genericoper="no"
          userstats="Pu">

#-#-#-#-#-#-#-#-#-#-#-#-# LIMITS CONFIGURATION  #-#-#-#-#-#-#-#-#-#-#-#
<limits
        maxaway="200"
        maxchan="60"
        maxhost="64"
        maxuser="10"
        maxkey="30"
        maxkick="300"
        maxmodes="20"
        maxnick="30"
        maxquit="300"
        maxreal="130"
        maxtopic="330">

#-#-#-#-#-#-#-#-#-#-#-# LOGGING CONFIGURATION #-#-#-#-#-#-#-#-#-#-#-#-#
<log method="file"
     level="normal"
     type="* -USERINPUT -USEROUTPUT"
     target="inspircd.log">

#-#-#-#-#-#-#-#-#-#-#-#-#-  WHOWAS OPTIONS   -#-#-#-#-#-#-#-#-#-#-#-#-#
<whowas groupsize="10" maxgroups="10000" maxkeep="7d" nickupdate="yes">

#-#-#-#-#-#-#-#-#-#-#-#-#-#-  BAN OPTIONS  -#-#-#-#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# Estas lineas son solo EJEMPLOS de badnick/badhost. Bórralas o        #
# ajústalas a tu gusto; no son obligatorias.                          #
#                                                                     #
#<badip ipmask="192.0.2.69" reason="No porn here thanks.">
#<badnick nick="Tr0ll123" reason="Don't use this nick.">
<badhost host="root@*" reason="Don't IRC as root!">

# Excepciones a K/G/Z-lines, por ejemplo el host de tus opers.
#<exception host="*@serverop.&networkDomain;" reason="Oper's hostname">

#-#-#-#-#-#-#-#-#-#-#- INSANE BAN OPTIONS  -#-#-#-#-#-#-#-#-#-#-#-#-#-#
<insane hostmasks="no" ipmasks="no" nickmasks="no" trigger="95.5">

#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-# MODULES #-#-#-#-#-#-#-#-#-#-#-#-#-#-#
<include file="modules.conf">

#-#-#-#-#-#-#-#-#-#-#- FILTRO DE PALABRAS / SPAM -#-#-#-#-#-#-#-#-#-#-#
<include file="filter.conf">

#-#-#-#-#-#-#-#-#-#-#-# SERVER LINKS / SERVICIOS #-#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# EDITAR: tus enlaces de servidor y el enlace a services (Anope/      #
# Atheme) van en links.conf.                                          #
#                                                                     #
<include file="links.conf">

#########################################################################
#                     Fin de inspircd.conf                             #
#########################################################################
