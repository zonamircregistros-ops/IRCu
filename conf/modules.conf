#<module name="redirect">

# extban b: - comparte baneos entre varios canales relacionados (por
# ejemplo si tienes #Chateanos y #Chateanos-en-espanol bajo el mismo
# equipo de moderacion).
#<module name="sharebans">

# Comando propio que muestra un fichero de texto, tipo /RULES con tus
# normas de red. Con showfile activo puedes anadir:
# <showfile name="RULES" file="rules.txt" introtext="Reglas de la red:">
#<module name="showfile">

# +O - restringe un canal a que solo puedan estar/entrar opers (y los
# extbans O:<tipo> / o:<cuenta> para restringirlo a un tipo de oper o
# cuenta concretos). Alternativa/complemento a dejar el canal +i como
# se hizo con #IRCops.
#<module name="operchans">

# +A - permite que cualquier usuario (no solo los ops) pueda invitar
# gente al canal.
#<module name="allowinvite">

# extban n: - banear por nombre de connect class (util si diferencias
# clases por tipo de conexion, p.ej. gateway web vs conexion directa).
#<module name="classban">

# extban j: - impide entrar a un canal si ya estas en otro concreto
# (o con cierto status en el). Poco habitual, pero existe.
#<module name="channelban">

# Autenticacion de usuarios contra una base de datos SQL externa en
# vez de (o ademas de) servicios. Requiere mysql/pgsql/sqlite3.
#<module name="sqlauth">

# Ident (RFC 1413): consulta al cliente que usuario del sistema esta
# usando. Anade un poco de lag a cada conexion y casi ningun cliente
# de escritorio lo soporta hoy en dia, por eso <connect:useident> esta
# en "no". Algunas redes lo piden igualmente por trazabilidad extra
# si sufren mucho abuso.
#<module name="ident">

# Espera un PING/PONG antes de dejar conectar del todo. Sirve para
# frenar cierto tipo de bots/proxies muy simples.
#<module name="conn_waitpong">
