########################################################################
#                                                                      #
#                  modules.conf - InspIRCd v4.11.0                    #
#                                                                      #
#  Seleccion de modulos pensada para una red publica "tipica" con      #
#  servicios (Anope/Atheme), TLS obligatorio en el puerto principal,   #
#  cloaking, SASL y proteccion anti-flood/anti-abuso.                  #
#                                                                      #
#  Lo unico que DEBES revisar/editar en este archivo es la seccion     #
#  TLS (rutas de certificado) y la clave secreta del cloaking.         #
#  Todo lo demas son valores razonables por defecto.                   #
#                                                                      #
#  Al final del archivo hay una lista de modulos adicionales que NO    #
#  estan activados pero que puede interesarte activar segun tu red     #
#  (bases de datos, geolocalizacion, LDAP, etc). Documentacion         #
#  completa de cada modulo: https://docs.inspircd.org/4/modules        #
########################################################################

# Para enlazar servidores (y para que tus <link> de links.conf
# funcionen) este modulo es OBLIGATORIO.
<module name="spanningtree">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  IRCv3 / CAP  #-#-#-#-#-#-#-#-#-#-#-#-#-#

<module name="cap">
<module name="ircv3">
<ircv3 accountnotify="yes"
       awaynotify="yes"
       extendedjoin="yes"
       noimplicitnames="yes"
       standardreplies="yes">
<module name="ircv3_accounttag">
<module name="ircv3_batch">
<module name="ircv3_capnotify">
<module name="ircv3_chghost">
<module name="ircv3_ctctags">
<module name="ircv3_echomessage">
<module name="ircv3_invitenotify">
<module name="ircv3_labeledresponse">
<module name="ircv3_msgid">
<module name="ircv3_servertime">
<module name="uhnames">
<module name="multiprefix">

# Bloquea PM/NOTICE/TAGMSG/INVITE de usuarios sin un canal en comun
# (modo de usuario +c). Se aplica por defecto a los usuarios via
# <connect:modes> en inspircd.conf.
<module name="commonchans">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-  AYUDA  #-#-#-#-#-#-#-#-#-#-#-#-#-#-#-

# Provee el comando /HELP (usado en motd.txt y opermotd.txt). El
# contenido esta en help.conf (la base de ayuda oficial de InspIRCd,
# cubre todos los comandos/modos/snomasks; puedes anadirle temas
# propios al final).
<module name="help">
<include file="help.conf">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  TLS  #-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# EDITAR: certfile/keyfile deben apuntar a tu certificado (por        #
# ejemplo, uno emitido por Let's Encrypt: fullchain.pem/privkey.pem). #
# Las rutas relativas son relativas al directorio de configuracion.   #
#                                                                     #
# NOTA: ssl_openssl es un modulo "extra": si tu paquete/compilacion   #
# no lo trae activado necesitas recompilar con                       #
# "./configure --enable-extras ssl_openssl" (o instalar el paquete    #
# correspondiente de tu distro, p.ej. inspircd-modules-ssl-openssl).  #
# Alternativa: ssl_gnutls (mismo concepto, con GnuTLS en vez de       #
# OpenSSL); son compatibles entre si para enlazar servidores.         #

<module name="ssl_openssl">

<sslprofile name="Clients"
            certfile="cert.pem"
            keyfile="key.pem"
            hash="sha256"
            # dhfile="dhparams.pem"
            >

<sslprofile name="Servers"
            certfile="cert.pem"
            keyfile="key.pem"
            hash="sha256"
            requestclientcert="no"
            # dhfile="dhparams.pem"
            >

# NOTA sobre dhfile: en compilaciones recientes de OpenSSL (3.x) los
# parametros Diffie-Hellman se generan automaticamente y NO hace falta
# dhfile. Si tu build lo pide (error "Couldn't set DH parameters" al
# arrancar), genera uno con:
#   openssl dhparam -out /ruta/a/conf/dhparams.pem 2048
# y descomenta la linea dhfile de arriba en ambos perfiles.

# Permite ver info del certificado TLS de otros usuarios (/SSLINFO) y
# que los opers puedan identificarse por fingerprint. Muy recomendado.
<module name="sslinfo">

# Modo de canal/usuario +z (solo TLS) y extban z: (fingerprint).
<module name="sslmodes">

# Permite que clientes en texto plano (puerto 6667) hagan STARTTLS
# para subir la conexion a TLS.
<module name="starttls">

# Permite recargar los certificados TLS (tras renovar con Let's
# Encrypt/certbot, por ejemplo) enviando SIGUSR1 al proceso, sin tener
# que hacer un REHASH completo ni reiniciar. Utilidad tipica en un
# deploy-hook de certbot: "kill -USR1 $(cat inspircd.pid)".
<module name="sslrehashsignal">

<module name="sha1">
<module name="sha2">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  HASHING  #-#-#-#-#-#-#-#-#-#-#-#-#-#-#-#

# Necesario para poder usar contrasenas hasheadas en opers.conf
# (recomendado en vez de contrasenas en texto plano).
<module name="bcrypt">
<bcrypt rounds="10">
<module name="password_hash">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  CLOAKING  #-#-#-#-#-#-#-#-#-#-#-#-#-#-#-
#                                                                     #
# EDITAR: cambia la "key" por una cadena aleatoria propia de al       #
# menos 30 caracteres (por ejemplo con: openssl rand -hex 32).        #
# NUNCA la compartas ni la reutilices de este ejemplo: con ella se    #
# pueden falsificar/deshacer los cloaks de tu red.                    #
# IMPORTANTE: si cambias esta key mas adelante, se romperan los bans  #
# existentes basados en el cloak.                                     #
#                                                                     #
# Se usan DOS metodos de cloak, en este orden (el primero que pueda   #
# generar un resultado para el usuario es el que se aplica, y se      #
# recalcula solo al iniciar sesion en una cuenta -- InspIRCd hace      #
# esto automaticamente vía OnAccountChange, no hace falta nada mas):  #
#                                                                     #
#  1) cloak_user (metodo "account"): si el usuario esta identificado  #
#     a una cuenta de servicios (SASL o NickServ), su host mostrado   #
#     pasa a ser "chateanos/user/<su_cuenta>" automaticamente.        #
#  2) cloak_sha256 (metodo hmac-sha256): mientras el usuario NO este   #
#     identificado, se le sigue ocultando la IP/host real con un      #
#     cloak hasheado normal (privacidad para usuarios anonimos).      #
#                                                                     #

<module name="cloak">
<module name="cloak_user">
<cloak method="account"
       prefix="chateanos/user/"
       suffix=""
       case="lower">

<module name="cloak_sha256">
<cloak method="hmac-sha256"
       key="CAMBIA_ESTA_CLAVE_POR_UNA_ALEATORIA_DE_AL_MENOS_30_CARACTERES"
       prefix="&networkName;-"
       suffix="ip"
       case="lower"
       hostparts="3"
       pathparts="1">

# Aplica automaticamente el modo +x (cloak) a los usuarios al
# conectar, segun <connect:modes> en inspircd.conf.
<module name="conn_umodes">

# NOTA sobre el cloak de los IRCops ("chateanos/support/cuenta"):
# InspIRCd NO permite generar automaticamente un cloak distinto solo
# por ser oper (el sistema de cloaks no distingue "es oper" de "es
# usuario normal", solo cuenta/IP/nick/etc). La forma correcta y la
# que usan redes reales (p.ej. Freenode/Libera con "network/staff/
# nick") es asignar el vhost "chateanos/support/<cuenta>" a mano, uno
# por uno, en el <oper> de cada IRCop -- ver opers.conf, ya viene
# preparado con ese formato.


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  SERVICIOS  #-#-#-#-#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
# Pensado para Anope o Atheme. El enlace al servidor de servicios se  #
# configura en links.conf usando &servicesServer; (definido en        #
# inspircd.conf).                                                     #
#                                                                     #

# Soporte de cuentas de usuario (account tracking, extbans R/r, etc).
<module name="account">

# Integracion generica con el paquete de servicios.
<module name="services">
<servicesintegration accountoverrideshold="no"
                      disablemodes="no">

# SASL (AUTHENTICATE) via services. Requiere el modulo cap.
<module name="sasl">
<sasl target="&servicesServer;">

# Reenvia la contrasena de conexion (PASS o /NICK nick:clave) a
# NickServ para clientes antiguos que no soportan SASL.
<module name="passforward">
<passforward nick="NickServ"
             forwardmsg="NOTICE %nick% :*** Reenviando contrasena a %nickrequired%"
             cmd="SQUERY %nickrequired% :IDENTIFY %nick% %pass%">

# Necesarios para que servicios (HostServ, etc) pueda gestionar
# vhosts, ident y nombres de usuarios.
<module name="chghost">
<module name="chgident">
<module name="chgname">
<module name="sethost">
<module name="setident">
<module name="setidle">

# Compatibilidad: clientes que NO soportan la extension IRCv3
# chghost (ircv3_chghost, ya activada arriba) ven un cambio de host
# como si el usuario hubiera hecho PART+JOIN. Los clientes modernos
# ignoran esto y usan chghost normalmente.
<module name="hostcycle">


#-#-#-#-#-#-#-#-#-#-#-#-#-#  CANALES / MODOS  #-#-#-#-#-#-#-#-#-#-#-#-#

<module name="banexception">       # +e - excepciones de ban
<module name="exemptchanops">      # exime a (semi)ops de ciertas restricciones
<module name="opmoderated">        # +U - oculta a usuarios sin voz/op entre ellos, ops si los ven
<module name="deaf">                # +d/+D - sordo a mensajes de canal/privados

# Evita nombres de canal con colores, negrita u otros codigos de
# formato IRC (se usan para hacer canales "falsos" que parecen otros,
# p.ej. para phishing). Deja pasar todo lo demas, incluyendo unicode.
# Codigos bloqueados: 2=negrita 3=color 4=color-hex 15=reset
# 17=monoespaciado 22=invertir 29=cursiva 30=tachado 31=subrayado.
<module name="channames">
<channames denyrange="2,3,4,15,17,22,29,30,31">

# Historial de canal (+H). El limite AQUI es el TOPE maximo que se
# puede pedir con /MODE #canal +H lineas:duracion; cada canal debe
# activarlo (los chanops lo hacen, o via ChanServ). #Chateanos e
# #IRCops ya lo traen activado por defecto mas abajo (permchannels).
<module name="chanhistory">
<chanhistory maxlines="100" maxduration="3d" prefixmsg="yes">

<module name="inviteexception">    # +I - excepciones de invitacion
<module name="knock">              # /KNOCK y +K
<module name="muteban">            # extban m: - silenciar sin banear

# +g - callerid: bloquea PMs de desconocidos salvo que el usuario los
# acepte con /ACCEPT. Muy recomendable a partir de unos pocos miles
# de usuarios para cortar el spam por privado.
<module name="callerid">
<callerid maxaccepts="30" cooldown="1m">
<module name="noctcp">              # +C / +T - bloquear CTCP
<module name="nonotice">            # +T - bloquear NOTICE al canal
<module name="nonicks">             # +N - impedir cambio de nick en canal
<module name="nokicks">             # +Q - impedir kicks
<module name="stripcolor">          # +S - elimina formato/color
<module name="blockcolor">          # +c - bloquea mensajes con color
<module name="botmode">             # +B - marca de bot en WHOIS
<module name="uninvite">            # /UNINVITE
<module name="timedbans">           # /TBAN - bans temporales
<module name="realnameban">         # extban a: - ban por realname
<module name="serverban">           # extban s: - ban por servidor de origen
<module name="cycle">               # /CYCLE

# Canales permanentes (+P). Requiere servidor operador o de servicios
# para activarlo, salvo que cambies "operonly".
<module name="permchannels">
<permchanneldb filename="permchannels.conf" operonly="yes">
<include file="permchannels.conf" missingokay="yes">

# Canal general de la red. Se crea solo al arrancar, con historial de
# chat activado (+H, 50 lineas / 1 dia) para que quien entre vea de
# que se estaba hablando.
<permchannels channel="#Chateanos" modes="ntH 50:1d" topic="Bienvenido/a a &networkName; -- charla general.">

# Canal privado de IRCops: +s (oculto de /LIST y /WHOIS de no-opers)
# +i (solo se entra por invitacion). Los opers entran solos gracias a
# operjoin con override="yes" (ver mas abajo), los usuarios normales
# no pueden verlo ni unirse.
<permchannels channel="#IRCops" modes="ntsiH 100:3d" topic="Canal interno de IRCops.">

# Auto-join de TODOS los usuarios al canal general al conectar.
<module name="conn_join">
<autojoin channel="#Chateanos">

# Comandos "fantasma" tipo !cs, !ns, /id, muy comunes con servicios.
<module name="alias">
<fantasy prefix="!">
<alias text="ID" format="#*" replace="PRIVMSG ChanServ :IDENTIFY $2 $3" requires="ChanServ" service="yes">
<alias text="ID" replace="PRIVMSG NickServ :IDENTIFY $2" requires="NickServ" service="yes">
<alias text="NS" usercommand="no" channelcommand="yes" replace="PRIVMSG NickServ :$2-" requires="NickServ" service="yes">
<alias text="CS" usercommand="no" channelcommand="yes" replace="PRIVMSG ChanServ :$1 $chan $2-" requires="ChanServ" service="yes">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  ANTI-ABUSO  #-#-#-#-#-#-#-#-#-#-#-#-#-#-

# Z-linea automatica a IPs que reconectan demasiado rapido.
<module name="connectban">
<connectban threshold="10" banduration="6h">

# Limita el numero de conexiones nuevas por periodo de tiempo.
<module name="connflood">
<connflood period="30" maxconns="3" timeout="30" bootwait="2m">

# DNSBL: consulta DroneBL (lista publica y gratuita de bots/proxies/
# VPNs abusivas) en cada conexion y Z-linea automaticamente segun lo
# que responda. A partir de unos miles de usuarios esto es de lo mas
# rentable contra bots/spam -- la config completa (que respuestas
# significan que) esta en dnsbl.conf, no hace falta tocarla.
<module name="dnsbl">
<include file="dnsbl.conf">

<module name="messageflood">       # +f - flood de mensajes
<module name="joinflood">          # +j - flood de joins
<module name="nickflood">          # +F - flood de cambios de nick
<module name="kicknorejoin">       # +J - evita re-join tras kick

# Filtro de mensajes por patrones (glob). Los patrones se definen en
# filter.conf.
<module name="filter">
<module name="regex_glob">
<filteropts engine="glob" notifyuser="yes">

# Filtro de canal (+g), configurable por los propios chanops.
<module name="chanfilter">

# R-lines: ban por patron sobre nick!user@host realname.
<module name="rline">
<rline matchonnickchange="yes" useflags="no" zlineonmatch="no" engine="glob">

# Retrasa el uso de /LIST a usuarios recien conectados (anti-spambot).
<module name="securelist">
<securelist waittime="1m" showmsg="yes">

<module name="monitor">            # /MONITOR - listas de notificacion modernas
<module name="watch">              # /WATCH - listas de notificacion clasicas
<module name="silence">            # /SILENCE - ignore del lado del servidor

# Guarda G/K/Z/R-lines etc en disco para que sobrevivan a un reinicio.
<module name="xline_db">
<xlinedb filename="xline.db">


#-#-#-#-#-#-#-#-#-#-#-#-#-#-#  HERRAMIENTAS DE OPER  #-#-#-#-#-#-#-#-#-
#                                                                     #
# Estos modulos habilitan los comandos que ya estan asignados a las   #
# clases de oper en opers.conf (SACommands, BanControl, OperChat,     #
# HostCloak, Shutdown, SupportCommands -- esta ultima es la clase     #
# reducida del tipo "Soporte"). Si quitas algun comando de una clase  #
# en opers.conf, puedes comentar aqui el modulo correspondiente.      #
#                                                                     #

<module name="sajoin">
<module name="sapart">
<module name="sanick">
<module name="saquit">
<module name="satopic">
<module name="sakick">
<module name="samode">
<module name="ojoin">
<ojoin prefix="!" notice="yes" op="yes">

# /CLEARCHAN: mata, kickea o banea de golpe a todos los usuarios de un
# canal que cumplan un criterio. Es la herramienta para cortar un raid
# de bots en #Chateanos de un solo comando. Solo Administrador/IRCop
# la tienen (esta en la clase BanControl de opers.conf).
<module name="clearchan">

# Auto-join de los IRCops (las 3 categorias) al canal de staff en
# cuanto hacen /OPER. override="yes" les deja entrar aunque el canal
# sea +i/+s (ver <permchannels channel="#IRCops"> mas arriba).
<module name="operjoin">
<operjoin channel="#IRCops" override="yes">
<module name="tline">
<module name="check">
<module name="nicklock">
<module name="shun">
<shun enabledcommands="ADMIN OPER PING PONG QUIT PART JOIN" allowconnect="no">
<module name="cban">
<module name="alltime">
<module name="swhois">
<module name="globops">
<module name="globalload">
<module name="chancreate">
<module name="seenicks">

# Oper override: permite a Administrador/IRCop saltarse restricciones
# de canal (ban, +i, +k...). "noisy" avisa al canal cuando se usa,
# para transparencia y accountability.
<module name="override">
<override noisy="yes" requirekey="no" timeout="30m">

<module name="operlog">
<operlog tosnomask="yes">
<module name="opermodes">
<module name="opermotd">
<module name="rmode">
<module name="remove">
<remove supportnokicks="yes" protectedrank="50000">
<module name="showwhois">

# Vuelca snotices clave a #IRCops, ademas de a quien tenga puesto el
# snomask por /MODE +s. Asi el canal de staff sirve de "muro" en vivo
# de conexiones, opers, bans y kills sin que nadie tenga que estar con
# el snomask activo todo el rato. A=allopers c/C=connects o=opers
# x=xlines(g/k/z/etc) k=kills G=globops.
<module name="chanlog">
<chanlog snomasks="AcCoxkG" channel="#IRCops">


