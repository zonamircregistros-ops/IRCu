########################################################################
#                                                                      #
#                   filter.conf - InspIRCd v4.11.0                    #
#                                                                      #
#  Filtro de mensajes (modulo "filter", motor "glob" activado en       #
#  modules.conf). Aqui defines patrones que bloquean/kickean/banean    #
#  mensajes que coincidan. Esto es 100% opcional y especifico de cada  #
#  red: no hay nada activado por defecto, son solo ejemplos.           #
#                                                                      #
#  Sintaxis:                                                           #
#  <keyword pattern="patron glob" reason="motivo" action="accion"      #
#           flags="flags" duration="duracion opcional">                #
#                                                                      #
#  action: warn | block | silent | none | kill | gline | zline | shun  #
#  flags:  p=privmsg/query n=notice P=part q=quit o=no-a-opers          #
#          r=no-a-registrados c=quita colores antes de comparar         #
#          *=todos menos r  -=ninguno                                  #
#                                                                      #
#  Tambien puedes anadir/quitar filtros en caliente con /FILTER.       #
########################################################################

# Ejemplos (comentados). Descomenta y ajusta a tu gusto:
#<keyword pattern="*qwerty*" reason="You qwertied!" action="block" flags="pn">
#<keyword pattern="*killmenow*" reason="As you request." action="kill" flags="*">
#<keyword pattern="*blah*" reason="Don't blah!" action="gline" duration="1d6h" flags="-">

# Canales exentos del filtro (util para #opers, #help, etc):
#<exemptfromfilter target="#opers">

# Los mensajes hacia servicios nunca se filtran salvo que lo excluyas
# explicitamente al reves; puedes exentar destinatarios concretos:
#<exemptfromfilter target="NickServ">
