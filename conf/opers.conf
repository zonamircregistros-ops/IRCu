########################################################################
#                                                                      #
#                   opers.conf - InspIRCd v4.11.0                     #
#                                                                      #
#  Clases, tipos y cuentas de IRCop. ESTE es el archivo que debes      #
#  editar con tus propios operadores: cambia (o anade/quita) los      #
#  bloques <oper> de mas abajo con tus nicks, hosts y contrasenas.     #
#                                                                      #
#  Hay 3 categorias de IRCop, de mas a menos privilegios:              #
#    - Administrador: control total del servidor (DIE/RESTART/REHASH, #
#      enlaces de servidor, bans, todo).                               #
#    - IRCop: moderacion completa (bans, kills, SA*) pero sin poder    #
#      apagar/reiniciar el servidor ni tocar enlaces entre servidores. #
#    - Soporte (novato): solo investigar (/CHECK) y entrar a ayudar    #
#      en canales (/OJOIN, /SAKICK). No puede banear, matar ni tocar   #
#      hosts/ident de otros usuarios.                                  #
#                                                                      #
#  Las TRES categorias reciben el mismo formato de vhost al operar:    #
#  "chateanos/support/<su_cuenta>". InspIRCd no puede rellenar         #
#  <su_cuenta> automaticamente (el sistema de cloaks no distingue si   #
#  un usuario es oper o no), asi que debes escribirlo tu a mano en     #
#  cada bloque <oper> de mas abajo -- es la misma forma en que redes   #
#  como Freenode/Libera asignaban "network/staff/nick". Ya que vas a   #
#  editar cada IRCop de todas formas, es el mismo paso.                #
#                                                                      #
#  Genera contrasenas hasheadas con (una vez el ircd este arrancado):  #
#     /MKPASSWD bcrypt tu_contrasena_en_claro                          #
#  y pega el resultado en el campo "password" con hash="bcrypt".       #
#  NUNCA dejes contrasenas de IRCop en texto plano en produccion.      #
########################################################################

#-#-#-#-#-#-#-#-#-#-#-#-#  CLASS CONFIGURATION  #-#-#-#-#-#-#-#-#-#-#-#

<class
     name="Shutdown"
     commands="DIE RESTART REHASH LOADMODULE UNLOADMODULE RELOADMODULE GLOADMODULE GUNLOADMODULE GRELOADMODULE"
     privs="users/auspex channels/auspex servers/auspex users/mass-message users/flood/no-throttle users/flood/increased-buffers"
     usermodes="*"
     chanmodes="*"
     snomasks="*">

<class name="SACommands" commands="SAJOIN SAPART SANICK SAQUIT SATOPIC SAKICK SAMODE OJOIN">
<class name="ServerLink" commands="CONNECT SQUIT RCONNECT RSQUIT MKPASSWD ALLTIME SWHOIS" usermodes="*" chanmodes="*" privs="servers/auspex" snomasks="Cc">
<class name="BanControl" commands="KILL GLINE KLINE ZLINE QLINE ELINE TLINE RLINE CHECK NICKLOCK NICKUNLOCK SHUN CBAN CLEARCHAN" usermodes="*" chanmodes="*" snomasks="Xx">
<class name="OperChat" commands="WALLOPS GLOBOPS" usermodes="*" chanmodes="*" privs="users/mass-message" snomasks="Gg">
<class name="HostCloak" commands="SETHOST SETIDENT SETIDLE CHGNAME CHGHOST CHGIDENT" usermodes="*" chanmodes="*" privs="users/auspex">

# Clase reducida para Soporte/novatos: solo investigar (CHECK), poder
# entrar a cualquier canal para ayudar/mediar (OJOIN) y sacar a un
# usuario problematico de un canal puntual (SAKICK). Nada de bans,
# kills, ni cambiar host/ident/nombre de otros.
<class name="SupportCommands" commands="CHECK OJOIN SAKICK" privs="users/auspex channels/auspex" snomasks="c">


#-#-#-#-#-#-#-#-#-#-#-#-  OPERATOR COMPOSITION   -#-#-#-#-#-#-#-#-#-#-#

<type
    name="Administrador"
    classes="SACommands OperChat BanControl HostCloak Shutdown ServerLink"
    vhost="&cloakBase;/support/CAMBIA_ESTO_POR_LA_CUENTA"
    maxchans="60"
    motd="opermotd.txt"
    automotd="yes"
    modes="+s +cCqQ">

<type
    name="IRCop"
    classes="SACommands OperChat BanControl HostCloak"
    vhost="&cloakBase;/support/CAMBIA_ESTO_POR_LA_CUENTA"
    maxchans="60"
    motd="opermotd.txt"
    automotd="yes"
    modes="+s +cCqQ">

<type
    name="Soporte"
    classes="SupportCommands OperChat"
    vhost="&cloakBase;/support/CAMBIA_ESTO_POR_LA_CUENTA"
    maxchans="40"
    motd="opermotd.txt"
    automotd="yes"
    modes="+s +c">


#-#-#-#-#-#-#-#-#-#-#-  OPERATOR CONFIGURATION   -#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
#  EDITAR: sustituye estos ejemplos por tus propios IRCops. Solo dale #
#  el tipo "Administrador" a gente de absoluta confianza: tiene       #
#  control total del servidor (DIE/RESTART/REHASH incluidos).         #
#  El vhost de cada uno debe quedar como "chateanos/support/<su       #
#  cuenta de servicios>" -- cambia CAMBIA_ESTO_POR_LA_CUENTA por el   #
#  nick/cuenta real de cada persona.                                  #
#                                                                     #

<oper
      name="TuNickAdministrador"
      hash="bcrypt"
      password="$2a$10$CAMBIA.ESTE.HASH.POR.EL.TUYO.GENERADO.CON.MKPASSWD"
      host="*@tu.host.o.ip.aqui *@127.0.0.1"
      vhost="&cloakBase;/support/TuNickAdministrador"
      # Si activas TLS obligatorio para operar, descomenta:
      #sslonly="yes"
      type="Administrador">

<oper
      name="TuNickIRCop"
      hash="bcrypt"
      password="$2a$10$CAMBIA.ESTE.HASH.POR.EL.TUYO.GENERADO.CON.MKPASSWD"
      host="*@otro.host.o.ip.aqui"
      vhost="&cloakBase;/support/TuNickIRCop"
      type="IRCop">

<oper
      name="TuNickSoporte"
      hash="bcrypt"
      password="$2a$10$CAMBIA.ESTE.HASH.POR.EL.TUYO.GENERADO.CON.MKPASSWD"
      host="*@otro.host.o.ip.mas"
      vhost="&cloakBase;/support/TuNickSoporte"
      type="Soporte">

# Una vez hayas anadido tus propios IRCops de verdad y borrado o
# sustituido los ejemplos de arriba, borra la siguiente linea.
<die reason="Estas usando opers.conf sin haberlo editado: riesgo de seguridad">
