########################################################################
#                                                                      #
#                   opers.conf - InspIRCd v4.11.0                     #
#                                                                      #
#  Clases, tipos y cuentas de IRCop. ESTE es el archivo que debes      #
#  editar con tus propios operadores: cambia (o anade/quita) los      #
#  bloques <oper> de mas abajo con tus nicks, hosts y contrasenas.     #
#                                                                      #
#  Las clases y tipos ya estan preparadas para que coincidan con los   #
#  modulos activados en modules.conf (SACommands, BanControl,          #
#  OperChat, HostCloak, Shutdown, ServerLink). Si no tocas ese         #
#  archivo no necesitas tocar esta parte.                              #
#                                                                      #
#  Genera contrasenas hasheadas con (una vez el ircd este arrancado):  #
#     /MKPASSWD bcrypt tu_contrasena_en_claro                          #
#  y pega el resultado en el campo "password" con hash="bcrypt".       #
#  NUNCA dejes contrasenas de IRCop en texto plano en produccion.      #
########################################################################

#-#-#-#-#-#-#-#-#-#-#-#-#  CLASS CONFIGURATION  #-#-#-#-#-#-#-#-#-#-#-#

<class
     name="Shutdown"
     commands="DIE RESTART REHASH LOADMODULE UNLOADMODULE RELOADMODULE GLOADMODULE GUNLOADMODULE GRELOADMODULE"
     privs="users/auspex channels/auspex servers/auspex users/mass-message users/flood/no-throttle users/flood/increased-buffers"
     usermodes="*"
     chanmodes="*"
     snomasks="*">

<class name="SACommands" commands="SAJOIN SAPART SANICK SAQUIT SATOPIC SAKICK SAMODE OJOIN">
<class name="ServerLink" commands="CONNECT SQUIT RCONNECT RSQUIT MKPASSWD ALLTIME SWHOIS" usermodes="*" chanmodes="*" privs="servers/auspex" snomasks="Cc">
<class name="BanControl" commands="KILL GLINE KLINE ZLINE QLINE ELINE TLINE RLINE CHECK NICKLOCK NICKUNLOCK SHUN CBAN" usermodes="*" chanmodes="*" snomasks="Xx">
<class name="OperChat" commands="WALLOPS GLOBOPS" usermodes="*" chanmodes="*" privs="users/mass-message" snomasks="Gg">
<class name="HostCloak" commands="SETHOST SETIDENT SETIDLE CHGNAME CHGHOST CHGIDENT" usermodes="*" chanmodes="*" privs="users/auspex">


#-#-#-#-#-#-#-#-#-#-#-#-  OPERATOR COMPOSITION   -#-#-#-#-#-#-#-#-#-#-#

<type
    name="NetAdmin"
    classes="SACommands OperChat BanControl HostCloak Shutdown ServerLink"
    vhost="netadmin.&networkDomain;"
    maxchans="60"
    motd="opermotd.txt"
    automotd="yes"
    modes="+s +cCqQ">

<type name="GlobalOp" classes="SACommands OperChat BanControl HostCloak ServerLink" vhost="ircop.&networkDomain;" motd="opermotd.txt" automotd="yes" modes="+s +cCqQ">
<type name="Helper" classes="HostCloak" vhost="helper.&networkDomain;" motd="opermotd.txt" automotd="yes">


#-#-#-#-#-#-#-#-#-#-#-  OPERATOR CONFIGURATION   -#-#-#-#-#-#-#-#-#-#-#
#                                                                     #
#  EDITAR: sustituye estos ejemplos por tus propios IRCops. Solo dale #
#  el tipo "NetAdmin" a gente de absoluta confianza: tiene control     #
#  total del servidor (DIE/RESTART/REHASH incluidos).                 #
#                                                                     #

# Ejemplo con contrasena hasheada con bcrypt (recomendado).
<oper
      name="TuNickDeOper"
      hash="bcrypt"
      password="$2a$10$CAMBIA.ESTE.HASH.POR.EL.TUYO.GENERADO.CON.MKPASSWD"
      host="*@tu.host.o.ip.aqui *@127.0.0.1"
      # Si activas TLS obligatorio para operar, descomenta:
      #sslonly="yes"
      type="NetAdmin">

# Segundo ejemplo, tipo con menos privilegios (ayudante/helper).
<oper
      name="TuNickDeHelper"
      hash="bcrypt"
      password="$2a$10$CAMBIA.ESTE.HASH.POR.EL.TUYO.GENERADO.CON.MKPASSWD"
      host="*@otro.host.o.ip.aqui"
      type="Helper">

# Una vez hayas anadido tus propios IRCops de verdad y borrado o
# sustituido los ejemplos de arriba, borra la siguiente linea.
<die reason="Estas usando opers.conf sin haberlo editado: riesgo de seguridad">
