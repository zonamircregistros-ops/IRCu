########################################################################
#                                                                      #
#                   links.conf - InspIRCd v4.11.0                     #
#                                                                      #
#  Puertos de enlace entre servidores y bloques <link>/<autoconnect>/  #
#  <services>. ESTE es el archivo que debes editar con tus propios     #
#  servidores (hubs, leaves y el servidor de servicios).               #
#                                                                      #
#  Recuerda: para que los enlaces funcionen necesitas el modulo        #
#  spanningtree cargado (ya esta activado en modules.conf).            #
########################################################################

#-#-#-#-#-#-#-#-#-#-#-#-   PORT CONFIGURATION   -#-#-#-#-#-#-#-#-#-#-#-
#                                                                     #
# EDITAR: si este servidor va a aceptar conexiones entrantes de otros #
# servidores (p.ej. es el hub), deja estos <bind> activos. Si es una  #
# leaf que solo se conecta hacia fuera, puedes comentarlos.           #
#                                                                     #

# Puerto TLS para enlaces de servidor (recomendado).
<bind address="" port="7005" type="servers" sslprofile="Servers">

# Puerto en texto plano para enlaces (solo recomendable en red local
# de confianza, p.ej. localhost hacia tus servicios).
<bind address="127.0.0.1" port="7000" type="servers">


#-#-#-#-#-#-#-#-#-#-#-  SERVER LINK CONFIGURATION  -#-#-#-#-#-#-#-#-#-#
#                                                                     #
# EDITAR: un bloque <link> por cada servidor con el que este servidor #
# pueda enlazar (directamente o como failover). "name" debe coincidir #
# EXACTAMENTE con el <server:name> del otro lado.                     #
#                                                                     #

<link
      name="hub.&networkDomain;"
      ipaddr="CAMBIA_ESTO.ip.o.hostname.del.otro.servidor"
      port="7005"
      allowmask="203.0.113.0/24"
      timeout="5m"
      sslprofile="Servers"
      statshidden="no"
      hidden="no"
      sendpass="CAMBIA_ESTA_CLAVE_DE_SALIDA"
      recvpass="CAMBIA_ESTA_CLAVE_DE_ENTRADA">

# Autoconecta a este servidor cada 5 minutos (tipico para que una
# leaf se conecte sola a su hub). Comenta si no lo necesitas, o si
# prefieres que el hub sea quien inicie la conexion.
#<autoconnect bootperiod="15s" period="5m" server="hub.&networkDomain;">

# Si acabas montando mas de un hub (ver README, seccion ESCALA), esta
# es la version con failover: prueba los servidores en orden, uno por
# uno, hasta que alguno conecte. Necesitas un <link> por cada nombre.
#<autoconnect bootperiod="15s" period="5m" server="hub1.&networkDomain; hub2.&networkDomain;">


#-#-#-#-#-#-#-#-#-#-#-# SERVICES  CONFIGURATION #-#-#-#-#-#-#-#-#-#-#-#-#
#                                                                       #
# EDITAR: enlace hacia tu paquete de servicios (Anope/Atheme). Debe    #
# coincidir con el nombre de servidor que configures en el propio     #
# paquete de servicios.                                                #
#                                                                       #

<link
      name="&servicesServer;"
      ipaddr="127.0.0.1"
      port="7000"
      allowmask="127.0.0.0/8 ::1"
      sendpass="CAMBIA_ESTA_CLAVE_DE_SALIDA_SERVICIOS"
      recvpass="CAMBIA_ESTA_CLAVE_DE_ENTRADA_SERVICIOS">

<services server="&servicesServer;" silent="yes">

# Una vez hayas configurado tus propios enlaces de verdad y borrado o
# sustituido los ejemplos de arriba, borra la siguiente linea.
<die reason="Estas usando links.conf sin haberlo editado: riesgo de seguridad">
